AWSTemplateFormatVersion: "2010-09-09"
# OIDC deploy test poke (2026-10-24): trivial change to exercise the
# GitHub-OIDC deploy path end-to-end.
Description: >
  pizza-eagle — the PTP ops box (bot host + Retool tunnel endpoint).
  Deploy the RENDERED template (build/pizza-eagle.rendered.yaml from
  scripts/render-template.sh — splices scripts/bootstrap.sh into UserData).
  Design: ~/Projects/SLACK_BOT_PLAN.md.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the Aurora cluster lives (bot has no inbound — SSM and Data API are outbound-only)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet (SSM egress only; bot has no inbound)
  InstanceType:
    Type: String
    # 2026-10-31: t4g.small (2GB) OOM'd under election-night feedflag peak
    # legs — global OOM killed the SSM agent + pizza-eagle and stranded the
    # Retool tunnel until a manual EC2 reboot. t4g.medium (4GB, same arm64
    # family) — a change here executes as an ASG-replacing update
    # (AutoScalingReplacingUpdate below) and lands with a fresh user-data;
    # re-run feedflag's ops/bastion/install.sh on the new box.
    Default: t4g.medium
  KeyName:
    Type: String
    Default: ""
    Description: Optional SSH key (v1 uses Session Manager; leave empty)
  BotSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the bot env (Slack tokens, model API key, alert webhook)
  BotSecretsPrefix:
    Type: String
    Description: Secrets Manager name prefix for the ops-box secrets (bot env, retool-ssh-key) — grants GetSecretValue on all matches
    Default: ptp/prod/pizza-eagle
  DnsHostedZoneId:
    Type: String
    Description: Route53 PUBLIC hosted zone id (Retool Cloud must resolve bastion.polls.pizza over the internet)
    Default: Z1C1DRRNI9HT62 # polls.pizza — verified via route53 ListHostedZones 2026-10-20
  LatestAl2023ArmAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: SSM public parameter — CloudFormation resolves at deploy time (no IAM needed)
  RdsSecurityGroupId:
    Type: String
    Default: sg-0e176dd57d8b04bde
    Description: SG on the pizzabase Aurora cluster — bastion duty needs 5432 egress to it (Retool tunnel + human psql)
  SlackAlarmChannel:
    Type: String
    Default: C01CFGKK279
    Description: Channel ID for liveness alerts (heartbeat-silence alarm posts here via a tiny SNS->Lambda forwarder, tagging SlackAlarmUser). C01CFGKK279 is #dev on the PTP workspace. Slack app must be a member.
  SlackAlarmUser:
    Type: String
    Default: U2ZLJ2KBP
    Description: Slack member id tagged in liveness alerts
  BackupBucketName:
    Type: String
    Description: S3 bucket for nightly state backups (sessions/case history). Empty string disables the grant.
    Default: ""

Conditions:
  HasBackupBucket: !Not [!Equals [!Ref BackupBucketName, ""]]

Resources:
  BotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # Session Manager
      Policies:
        # The read-only triage policy from pizzabase/docs/ptp-triage-readonly-policy.json
        - PolicyName: triage-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsRead
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:DescribeLogStreams, logs:GetLogEvents, logs:FilterLogEvents]
                Resource:
                  - arn:aws:logs:us-west-2:320802729995:log-group:/aws/lambda/pizzabase-*
                  # the agent can read its OWN logs (observability: "check your errors")
                  - arn:aws:logs:us-west-2:320802729995:log-group:/pizza-eagle*
              # Self-check probes + liveness heartbeat (scripts/self-check.mjs,
              # src/index.ts heartbeat): put/read the pizza-eagle namespace,
              # describe (never read) the bot's own secrets.
              - Sid: LivenessProbes
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecrets
                Resource: "*"
              # CloudWatch agent ships journald → /pizza-eagle/bot
              - Sid: LogsWriteAgent
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: arn:aws:logs:us-west-2:320802729995:log-group:/pizza-eagle*
              - Sid: MediaConvertRead
                Effect: Allow
                Action: [mediaconvert:GetJob, mediaconvert:ListJobs, mediaconvert:DescribeEndpoints]
                Resource: "*"
              - Sid: EventsRead
                Effect: Allow
                Action: [events:ListRules, events:DescribeRule]
                Resource: "*"
              # 2026-10-27 red team: LambdaRead (ListFunctions/GetFunction/...)
              # removed entirely — GetFunction returns function ENVIRONMENT
              # VARIABLES, and pizzabase's include Stripe/Twilio/Mailgun/JWT
              # secrets. Investigations have never needed it.
              - Sid: CloudFormationRead
                Effect: Allow
                # Change-set writes removed (2026-10-27): investigations read
                # stacks; the deploy role owns change sets.
                Action: [cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:DescribeChangeSet, cloudformation:ValidateTemplate]
                Resource: "*"
              - Sid: S3MediaRead
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject]
                Resource:
                  - arn:aws:s3:::raw.polls.pizza
                  - arn:aws:s3:::raw.polls.pizza/*
                  - arn:aws:s3:::reports.polls.pizza
                  - arn:aws:s3:::reports.polls.pizza/*
                  - arn:aws:s3:::scrubbed-uploads
                  - arn:aws:s3:::scrubbed-uploads/*
                  - arn:aws:s3:::processed-uploads
                  - arn:aws:s3:::processed-uploads/*
              # Bot additions (not in the manual triage profile):
              - Sid: SecretsRead
                Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                # Bot env (Slack tokens, model API key, alert webhook) and
                # the Retool tunnel user's authorized_key bootstrap the
                # user-data script fetches. Model API key may live in the
                # bot env secret or its own secret — same prefix.
                Resource:
                  - !Ref BotSecretArn
                  # slash-glob, NOT hyphen-glob: secret NAMES are prefix/env
                  # etc. — the hyphen form (${BotSecretsPrefix}-*) matches
                  # nothing because names continue with '/' not '-'
                  - !Sub arn:aws:secretsmanager:us-west-2:320802729995:secret:${BotSecretsPrefix}/*
                  # feedflag's env secret — the feedflag timer on this box
                  # auto-syncs /opt/feedflag/.env from it at boot (2026-10-30:
                  # token saves never reached the box; the sync was manual).
                  # Fixed prefix, not a stack param: feedflag deploys from its
                  # own repo (pizza-to-the-polls/feedflag) and pipeline.
                  - arn:aws:secretsmanager:us-west-2:320802729995:secret:ptp/prod/feedflag/*
              # Data API access for investigations — the core tool. Same
              # grants the manual ptp-agent profile has (the working setup
              # this scaffold was developed against). The caller needs BOTH:
              #   - rds-data:ExecuteStatement on the cluster
              #   - GetSecretValue on the DB secret (caller-side read:
              #     PizzaBaseReadOnly = ptp_ro, SELECT-only, all 14 tables)
              # Verified working 2026-10-19.
              - Sid: RdsDataExecute
                Effect: Allow
                Action: [rds-data:ExecuteStatement]
                Resource: arn:aws:rds:us-west-2:320802729995:cluster:pizzabase
              - Sid: DbSecretRead
                Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Sub arn:aws:secretsmanager:us-west-2:320802729995:secret:PizzaBaseReadOnly-*
              - Sid: EipAssociate # user-data self-associates the stack's EIP
                Effect: Allow
                # 2026-10-27 red team wanted this scoped to THIS stack's
                # allocation. Found live 2026-10-31 (t4g.medium rebirth):
                # AssociateAddress is ALSO evaluated against the association
                # TARGET — the instance ARN. An ASG-launched instance ID is
                # unknowable at template time, and `instance/*` scoping is
                # account-wide anyway, so the action cannot be scoped below
                # `*`. The scoped grant denied bootstrap at its EIP step
                # (EIP stranded, Retool tunnel dead) until this landed.
                # Residual risk accepted: code on the box can move any EIP in
                # the account. Mitigate at the boundary (the box is
                # single-purpose, no untrusted code) — not with IAM here.
                Action: [ec2:AssociateAddress]
                Resource: ["*"]
              - Sid: EipDescribe # bootstrap reads back the public IP
                Effect: Allow
                # DescribeAddresses is a LIST call — it does not support
                # resource-level grants, so the allocation-ARN scoping in the
                # 2026-10-27 red-team pass silently denied it. Found
                # 2026-10-31: the t4g.medium rebirth's bootstrap died right
                # at this step (EIP left unassociated, Retool tunnel dead)
                # because the Oct-24 box predated the scoping. Read-only and
                # there is exactly one allocation to see — allow on `*`.
                Action: [ec2:DescribeAddresses]
                Resource: ["*"]
              # DNS is NOT granted to the box: bastion.polls.pizza is a
              # stack-owned AWS::Route53::RecordSet (BastionDnsRecord) driven by
              # the EIP's PublicIp attribute — CFN keeps it correct on every
              # rebirth; no code on the box can touch the zone. (2026-10-31:
              # the 2026-10-27 DnsUpsert condition-keys statement never
              # matched — Route 53 does not populate the
              # route53:ChangeResourceRecordSets* context keys for this API —
              # so bootstrap's own upsert was denied on the t4g.medium
              # rebirth, stranding DNS updates and killing the bootstrap
              # mid-run. See also EipAssociate/EipDescribe Sids.)
              # Nightly tar of state/ (sessions + case history). Grant exists
              # ONLY when BackupBucketName is set — the empty-string default
              # must not widen to a malformed s3:::/* resource.
              - !If
                - HasBackupBucket
                - Sid: StateBackup
                  Effect: Allow
                  Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                  Resource:
                    - !Sub arn:aws:s3:::${BackupBucketName}/*
                    - !Sub arn:aws:s3:::${BackupBucketName}
                - !Ref AWS::NoValue
                # TODO when BackupBucketName is set: also add s3:GetObject
                # (restore path) + bucket versioning policy on the bucket.

  OpsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BotRole]

  OpsElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc # attached by user-data; box has no other public identity

  # bastion.polls.pizza A record, stack-owned. The box used to upsert this
  # itself (bootstrap step 8) under BotRole — but the 2026-10-27 red-team
  # Condition keys (route53:ChangeResourceRecordSets*) never match: Route 53
  # does not populate them for this API (probed live 2026-10-31 — every
  # Condition variant denied, unconditional allowed). CFN owns the record
  # instead: driven by the stack EIP's PublicIp, correct on every rebirth,
  # and NO code on the box can write the zone at all. CI deploys need
  # DeployRole Sid DnsRecordDeploy (below).
  BastionDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DnsHostedZoneId
      Name: bastion.polls.pizza
      Type: A
      TTL: 60
      ResourceRecords: [!GetAtt OpsElasticIP.PublicIp]

  OpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "pizza-eagle box - egress only except Retool tunnel"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0 # bot (wss), SSM, Data API, model API, gh, updates
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RdsSecurityGroupId # bastion duty (EGRESS uses Destination*, not Source*)
      SecurityGroupIngress:
        # Retool tunnel (port 22). CIDRs from
        # docs.retool.com/data-sources/reference/ip-allowlist-cloud-orgs
        # (us-west-2 outbound), fetched 2026-10-20 — re-check when Retool
        # changes egress (they publish a get-ip-allowlist API too).
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 35.90.103.132/30
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 44.208.168.68/30
      # No other inbound. Humans use Session Manager (outbound 443).

  OpsLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAl2023ArmAmi # SSM public param — service-resolved at deploy
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt OpsInstanceProfile.Arn }
        SecurityGroupIds: [!GetAtt OpsSecurityGroup.GroupId]
        MetadataOptions:
          HttpTokens: required # IMDSv2
        # UserData is RENDERED: scripts/render-template.sh splices
        # base64(gzip(scripts/bootstrap.sh)) at the BOOTSTRAP marker —
        # bootstrap.sh stays the single source of truth (the gzip layer
        # keeps the payload ~5KB vs the 16KB EC2 UserData cap; render-template
        # guards the size). CFN values flow to it via /etc/pizza-eagle/
        # bootstrap.env (the override file it reads).
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            mkdir -p /etc/pizza-eagle
            cat > /etc/pizza-eagle/bootstrap.env <<'ENVEOF'
            EIP_ALLOCATION_ID=${OpsElasticIP.AllocationId}
            DNS_ZONE_ID=${DnsHostedZoneId}
            DNS_NAME=bastion.polls.pizza
            SECRETS_PREFIX=${BotSecretsPrefix}
            ENVEOF
            echo '@@BOOTSTRAP_B64@@' | base64 -d | gzip -d > /root/bootstrap.sh
            bash /root/bootstrap.sh

  # GitHub OIDC: lets Actions deploy with short-lived tokens instead of
  # static AWS keys (the pizza-eagle-github-deploy role deploy.yml assumes).
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1] # GitHub root CA (AWS validates known providers server-side)
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pizza-eagle-github-deploy
      Description: GitHub Actions deploy role (repo pizza-to-the-polls/pizza-eagle) - changeset-first, scoped
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: [sts.amazonaws.com]
              StringLike:
                # GitHub sub carries org/repo numeric IDs + the environment
                # claim for environment-scoped jobs: repo:org@id/repo@id:environment:production
                # (proven live 2026-10-24 — only production-environment deploys may assume)
                token.actions.githubusercontent.com:sub: repo:pizza-to-the-polls@*/pizza-eagle@*:environment:production
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationValidateTemplate
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:ListStacks]
                Resource: "*" # global-scope: they validate/list, not stack-scoped
              - Sid: CloudFormationPizzaEagleStack
                Effect: Allow
                Action:
                  [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet,
                   cloudformation:DeleteChangeSet, cloudformation:DescribeStacks,
                   cloudformation:DescribeStackEvents, cloudformation:ExecuteChangeSet,
                   cloudformation:ListChangeSets, cloudformation:GetTemplateSummary]
                Resource: [!Sub arn:aws:cloudformation:us-west-2:320802729995:stack/pizza-eagle/*]
              # CFN manages BastionDnsRecord (2026-10-31, replaced the box's
              # own bootstrap upsert — see that resource's comment): deploys
              # call route53 under the DEPLOYER's identity, i.e. this role in
              # CI. Zone-scoped change+read; no condition keys (they never
              # populate for ChangeResourceRecordSets).
              - Sid: DnsRecordDeploy
                Effect: Allow
                Action: [route53:ChangeResourceRecordSets, route53:GetHostedZone]
                Resource: !Sub arn:aws:route53:::hostedzone/${DnsHostedZoneId}
              - Sid: SsmUpdateAgent
                Effect: Allow
                Action: [ssm:SendCommand, ssm:DescribeCommand, ssm:ListCommands, ssm:CancelCommand]
                Resource: "*"
              # The template resolves the AL2023 AMI from SSM public parameters
              # (public params have no account id in the ARN).
              - Sid: ResolveAmiPublicParameter
                Effect: Allow
                Action: ssm:GetParameters
                Resource: arn:aws:ssm:us-west-2::parameter/aws/service/ami-amazon-linux-latest/*
              # Off-box health check (GitHub Actions, scripts/health-check.mjs):
              # proves the agent is alive + backups flowing from OUTSIDE the box.
              # Actions and resources must line up per-service (CW metrics are
              # global-scope; the earlier one-lump grant denied GetMetricStatistics).
              - Sid: HealthProbeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref BotSecretArn
              - Sid: HealthProbeBackup
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${BackupBucketName}
              - Sid: HealthProbeHeartbeat
                Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: "*"

  # Liveness: the bot emits a pizza-eagle/Heartbeat metric every 5 min
  # (src/index.ts); this alarm fires when it goes silent — "systemd active"
  # alone can't see a hung socket.
  # SNS -> Lambda -> Slack forwarder: the alert path must live OUTSIDE the
  # box (a dead box can't report its own death). Reads SLACK_BOT_TOKEN from
  # the env secret at invoke; posts to SlackAlarmChannel tagging SlackAlarmUser.
  HeartbeatAlarmTopic:
    Type: AWS::SNS::Topic
  AlarmForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-bot-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref BotSecretArn }
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter, ssm:DeleteParameter]
                Resource: !Sub arn:aws:ssm:us-west-2:320802729995:parameter/pizza-eagle/alarm-thread-ts
  AlarmForwarder:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pizza-eagle-alarm-forwarder
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt AlarmForwarderRole.Arn
      Environment:
        Variables:
          SECRET_ID: !Ref BotSecretArn
          SLACK_CHANNEL: !Ref SlackAlarmChannel
          SLACK_USER: !Ref SlackAlarmUser
      Code:
        ZipFile: |
          // Alarm-state transitions only notify ONCE per change (CloudWatch
          // semantics), so "post once when down" is inherent. The recovery
          // post REPLYs to the original alert: its ts is kept in an SSM
          // bookmark until the thread is closed.
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const { SSMClient, GetParameterCommand, PutParameterCommand, DeleteParameterCommand } = require("@aws-sdk/client-ssm");
          const sm = new SecretsManagerClient({});
          const ssm = new SSMClient({});
          const TS_KEY = "/pizza-eagle/alarm-thread-ts";

          exports.handler = async (event) => {
            const m = JSON.parse(event.Records[0].Sns.Message);
            const state = m.NewStateValue; // ALARM | OK
            const env = JSON.parse(
              (await sm.send(new GetSecretValueCommand({ SecretId: process.env.SECRET_ID }))).SecretString
            );
            const post = (payload) => fetch("https://slack.com/api/chat.postMessage", {
              method: "POST",
              headers: { Authorization: `Bearer ${env.SLACK_BOT_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ channel: process.env.SLACK_CHANNEL, ...payload }),
            }).then((r) => r.json());

            if (state === "ALARM") {
              const j = await post({
                text:
                  `:rotating_light: <@${process.env.SLACK_USER}> *pizza-eagle liveness*: ` +
                  "`" + m.AlarmName + "` is now *ALARM*\n" + (m.NewStateReason || "") +
                  "\n_The bot's heartbeat went silent — check `ssh ptp-ops` / " +
                  "`journalctl -u pizza-eagle` / the CloudWatch console. Recovery will reply here._",
              });
              if (!j.ok) throw new Error("slack post failed: " + j.error);
              await ssm.send(new PutParameterCommand({
                Name: TS_KEY, Value: j.ts, Type: "String", Overwrite: true,
              }));
            } else if (state === "OK") {
              let parent;
              try {
                parent = (await ssm.send(new GetParameterCommand({ Name: TS_KEY }))).Parameter.Value;
              } catch { return; } // recovery with no prior alert post — nothing to reply to
              const j = await post({
                thread_ts: parent,
                text:
                  ":large_green_circle: *Self-healed* — `" + m.AlarmName + "` is back to OK.\n" +
                  (m.NewStateReason || ""),
              });
              await ssm.send(new DeleteParameterCommand({ Name: TS_KEY }));
              if (!j.ok) throw new Error("slack reply failed: " + j.error);
            }
          };
  AlarmForwarderSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref HeartbeatAlarmTopic
      Protocol: lambda
      Endpoint: !GetAtt AlarmForwarder.Arn
  AlarmForwarderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AlarmForwarder
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref HeartbeatAlarmTopic
  HeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: pizza-eagle-heartbeat
      AlarmDescription: pizza-eagle bot has not emitted a heartbeat in ~10 minutes — process hung or socket silently dead
      Namespace: pizza-eagle
      MetricName: Heartbeat
      Period: 300
      EvaluationPeriods: 2
      Statistic: Sum
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      TreatMissingData: breaching
      AlarmActions: [!Ref HeartbeatAlarmTopic]
      OKActions: [!Ref HeartbeatAlarmTopic]

  OpsMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: pizza-eagle-memory-high
      AlarmDescription: bastion memory >85% for 5 min — a ballooning leg paging before it can OOM the box (2026-10-31 incident class — feedflag peak leg OOM'd SSM agent + eagle, Retool tunnel stranded)
      Namespace: pizza-eagle
      MetricName: MemoryPercent
      Period: 300
      EvaluationPeriods: 1
      Statistic: Average
      ComparisonOperator: GreaterThanThreshold
      Threshold: 85
      # The bot's absence is HeartbeatAlarm's job; here missing = no
      # signal, not a memory claim — don't double-page on bot death.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref HeartbeatAlarmTopic]
      OKActions: [!Ref HeartbeatAlarmTopic]

  OpsASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    # 2026-10-31: without an UpdatePolicy, launch-template changes (the
    # t4g.medium resize) only affect NEW launches — the running instance
    # keeps its old type until manually replaced. WillReplace makes
    # template changes (type, AMI, user-data) roll the instance: CFN
    # terminates, the ASG relaunches, user-data re-runs (EIP + DNS
    # self-registration is in bootstrap). Brief single-instance downtime.
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true
    Properties:
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref OpsLaunchTemplate
        Version: !GetAtt OpsLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: pizza-eagle
          PropagateAtLaunch: true

Outputs:
  ElasticIPAllocationId:
    Value: !GetAtt OpsElasticIP.AllocationId
  BotRoleArn:
    Value: !GetAtt BotRole.Arn