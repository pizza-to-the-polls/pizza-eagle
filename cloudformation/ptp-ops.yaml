AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ptp-ops — the PTP ops box (bot host + Retool tunnel endpoint).
  DRAFT: review every TODO before first deploy. Resources match the
  design in ~/Projects/SLACK_BOT_PLAN.md.

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet (SSM egress only; bot has no inbound)
  InstanceType:
    Type: String
    Default: t4g.small
  RetoolSshCidrs:
    Type: String
    Default: ""
    Description: Comma-separated Retool Cloud egress CIDRs for port 22 (tunnel). Fetch from docs.retool.com/data-sources/reference/ip-allowlist-cloud-orgs
    AllowedPattern: "^(|\\d+\\.\\d+\\.\\d+\\.\\d+/\\d+(,\\d+\\.\\d+\\.\\d+\\.\\d+/\\d+)*)$"
  KeyName:
    Type: String
    Default: ""
    Description: Optional SSH key (v1 uses Session Manager; leave empty)
  BotSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the bot env (Slack tokens, alert webhook)
  DnsHostedZoneId:
    Type: String
    Description: Route53 PUBLIC hosted zone id (Retool Cloud must resolve bastion.polls.pizza over the internet)
    Default: TODO_PUBLIC_HOSTED_ZONE_ID

Resources:
  BotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # Session Manager
      Policies:
        # The read-only triage policy from pizzabase/docs/ptp-triage-readonly-policy.json
        - PolicyName: triage-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsRead
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:DescribeLogStreams, logs:GetLogEvents, logs:FilterLogEvents]
                Resource: arn:aws:logs:us-west-2:320802729995:log-group:/aws/lambda/pizzabase-*
              - Sid: MediaConvertRead
                Effect: Allow
                Action: [mediaconvert:GetJob, mediaconvert:ListJobs, mediaconvert:DescribeEndpoints]
                Resource: "*"
              - Sid: EventsRead
                Effect: Allow
                Action: [events:ListRules, events:DescribeRule]
                Resource: "*"
              - Sid: LambdaRead
                Effect: Allow
                Action: [lambda:ListFunctions, lambda:GetFunction, lambda:ListLayers, lambda:GetLayerVersion, lambda:ListLayerVersions]
                Resource: "*"
              - Sid: CloudFormationRead
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:DescribeChangeSet, cloudformation:CreateChangeSet, cloudformation:DeleteChangeSet, cloudformation:ValidateTemplate]
                Resource: "*"
              - Sid: S3MediaRead
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject]
                Resource:
                  - arn:aws:s3:::raw.polls.pizza
                  - arn:aws:s3:::raw.polls.pizza/*
                  - arn:aws:s3:::reports.polls.pizza
                  - arn:aws:s3:::reports.polls.pizza/*
                  - arn:aws:s3:::scrubbed-uploads
                  - arn:aws:s3:::scrubbed-uploads/*
                  - arn:aws:s3:::processed-uploads
                  - arn:aws:s3:::processed-uploads/*
              # Bot additions (not in the manual triage profile):
              - Sid: SecretsRead
                Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref BotSecretArn
              - Sid: EipAssociate # user-data self-associates the EIP
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DescribeAddresses]
                Resource: "*"
              - Sid: DnsUpsert # user-data upserts the bastion A record
                Effect: Allow
                Action: [route53:ChangeResourceRecordSets]
                Resource: !Sub arn:aws:route53:::hostedzone/${DnsHostedZoneId}

  DnsHostedZoneId:
    # Output-internal parameter so the role can reference it (CFN limitation).
    Type: String
    Default: TODO_PUBLIC_HOSTED_ZONE_ID

  OpsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BotRole]

  OpsElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc # attached by user-data; box has no other public identity

  OpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ptp-ops box — egress only except Retool tunnel
      VpcId: TODO_VPC_ID # TODO: set VPC id (or import from the pizzabase stack)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0 # bot (wss), SSM, Data API, model API, gh, updates
      SecurityGroupIngress: []
      # Retool tunnel (port 22) is added as separate Ingress resources so
      # the CIDR list expands cleanly — see RetoolTunnelIngress below.

  # TODO: expand RetoolSshCidrs into one AWS::EC2::SecurityGroupIngress per
  # CIDR at deploy time (or convert the parameter to a List<AWS::EC2::NetworkAclEntry...>).

  OpsLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64 # TODO: resolve SSM param at deploy time (aws ssm get-parameters)
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt OpsInstanceProfile.Arn }
        SecurityGroupIds: [!GetAtt OpsSecurityGroup.GroupId]
        MetadataOptions:
          HttpTokens: required # IMDSv2
        # UserData (base64 of scripts/bootstrap.sh with parameter substitution)
        # TODO: generate at deploy: `base64 <(envsubst < scripts/bootstrap.sh)`
        UserData: ""

  OpsASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref OpsLaunchTemplate
        Version: !GetAtt OpsLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: ptp-ops
          PropagateAtLaunch: true

Outputs:
  ElasticIPAllocationId:
    Value: !GetAtt OpsElasticIP.AllocationId
  BotRoleArn:
    Value: !GetAtt BotRole.Arn