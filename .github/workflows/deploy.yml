# [!IMPORTANT]
# Not a Bolt/Slack-CLI-platform app. This workflow deploys the ops box
# (CloudFormation) and can trigger the on-box update script — the Slack
# listener itself runs as a systemd unit on the instance
# (systemd/pizza-eagle.service), connecting out via Socket Mode.
# Do not add "slack deploy" steps here; slack-cli is used locally only.

# Deploys are pull-based first (the box self-updates nightly via
# pizza-eagle-update.timer: git pull --ff-only + rebuild + restart).
# This workflow exists for template changes (CFN) and for immediate
# (rather than waiting-for-tonight) agent updates on the box.
#
# Auth: GitHub OIDC role (no AWS keys in this repo — see SLACK_BOT_PLAN.md §5).
# The role needs cloudformation:* on the ops stack and ssm:SendCommand on
# the instance — create it once with the console, or IAM:

name: deploy

on:
  # Template changes: safe to auto-deploy — CFN change sets + ASG
  # instance refresh handle the rollout (old instance stays until replaced).
  push:
    branches: [main]
    paths:
      - "cloudformation/**"
      - "systemd/**"
      - "scripts/bootstrap.sh"
  # Immediate box update (same commands the nightly timer runs):
  workflow_dispatch:
    inputs:
      target:
        description: "deploy (CFN) | update-agent (SSM) | both"
        type: choice
        options: [update-agent, deploy, both]
        default: update-agent
        required: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: us-west-2
  STACK_NAME: pizza-eagle
  INSTANCE_TAG_KEY: Name
  INSTANCE_TAG_VALUE: pizza-eagle

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: OIDC claim debug (TEMPORARY — remove after trust is proven)
        run: |
          resp=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$resp" | python3 -c "
          import json, sys, base64
          t = json.load(sys.stdin)['value']
          p = t.split('.')[1]
          pad = p + '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(pad))
          print('sub:', c.get('sub'))
          print('aud:', c.get('aud'))
          print('iss:', c.get('iss'))
          "
      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320802729995:role/pizza-eagle-github-deploy
          aws-region: us-west-2
          # The role trusts this repo. See SLACK_BOT_PLAN.md for creation.

      - name: Render template (splice bootstrap.sh into UserData)
        run: bash scripts/render-template.sh # also validates

      - name: Deploy stack
        if: inputs.target == 'deploy' || inputs.target == 'both' || github.event_name == 'push'
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file build/pizza-eagle.rendered.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-execute-changeset  # CI shows the changeset; you review + execute
          echo "::notice::Change set created — review and execute in the console (P1 decision point)."

      - name: Update agent on the box (SSM)
        if: inputs.target == 'update-agent' || inputs.target == 'both'
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:${INSTANCE_TAG_KEY},Values=${INSTANCE_TAG_VALUE}" \
            --comment "pizza-eagle immediate update (same as nightly timer)" \
            --parameters 'commands=["git -C /opt/pizza-eagle pull --ff-only","dnf update -y nodejs","npm --prefix /opt/pizza-eagle ci --omit=dev","npm --prefix /opt/pizza-eagle run build","systemctl restart pizza-eagle.service","systemctl is-active pizza-eagle.service"]'

      - name: Report
        if: always()
        run: echo "::notice::see https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}"