name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run check
      - name: Unit tests (node:test)
        run: npm test
      - name: Build + import the emitted artifact (CJS/ESM drift check)
        run: |
          npm run build
          node -e "import('./dist/slack.js').then(m => { if (typeof m.toSlackMrkdwn !== 'function') { throw new Error('dist artifact did not import as a working ES module'); } console.log('dist imports OK'); })"
